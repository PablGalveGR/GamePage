<div class="gameContainer" *ngIf="game">
  <div class="gameHeader">
      <h2>{{game.name}}</h2>
      <img src="{{game.portrait}}">
      <button class="downloadGame">Download</button>
    </div>
  <div class="game">
    <div class="gameBody">
      <h2>Summary</h2>
      <section class="gameDesc">
        <p>{{game.description}}</p>
      </section>
      <section class="commentsContainer">
        <h2>Comments</h2>
        <ul>
          <li class="comment" *ngFor="let comment of comments | async">
            <h3 class="commentUser">{{getName(comment.username)}} <span>{{comment.date}}</span></h3>
            
            <p class="commentBody">{{comment.comment}}</p>
          </li>
        </ul>
      </section>
    </div>
    <div class="scoreBoardContainer">
      <h2>Scores</h2>
      @defer{
      <table class="scoreBoard">
        <tr>
          <td>Position</td>
          <td>Username</td>
          <td>Score</td>
        </tr>
        <tr *ngFor="let score of scores | async; let i = index">
          <td>{{i+1}}</td>
          <td>{{getName(score.username)}}</td>
          <td>{{score.score}}</td>
        </tr>
      </table>
      }
    </div>
  </div>
</div>
