<h2>Scores</h2>
@defer{
<table class="scoreBoard">
  <tr id="header">
    <td>Position</td>
    <td>Username</td>
    <td>Score</td>
  </tr>
  <tr class="tbody" *ngFor="let score of scores | async; let i = index">
    <td><p>{{i+1}}</p></td>
    <td><p>{{getName(score.username)}}</p></td>
    <td><p>{{score.score}}</p></td>
  </tr>
</table>
}
