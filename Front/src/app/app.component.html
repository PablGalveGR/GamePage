<nav class="desktop" *ngIf=desktop>
  <h1 class="title" (click)="goTo('')">{{title}}</h1>
  <ul>
    <li (click)="goTo('')">Browse Games</li>
    <li>Community</li>
    <app-signup-login />
  </ul>
</nav>
<nav class="mobile" *ngIf="!desktop">
  <div class="sideMenu">
    <i class="fa-solid fa-bars button" (click)="showHide()"></i>
    <ul class="left" *ngIf="!hide">
      <li (click)="goTo('')">Browse Games</li>
      <li>Community</li>
      
    </ul>
  </div>
  <h1 class="title" (click)="goTo('')">{{title}}</h1>
  <div class="sideMenuRight">
    <i class="fa-solid fa-user button" (click)="showHideUserMenu()"></i>
    <ul class="right" *ngIf="!hideUserMenu">
      <li><app-signup-login /></li>
    </ul>
  </div>

</nav>

<router-outlet></router-outlet>
